[project]
name = "oxp3-tool"
version = "0.2.0"
description = "Controller and wake-from-sleep fixes for the OneXPlayer 3 on Bazzite and CachyOS"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# The embedded JavaScript stays byte-identical to the version tested against Steam's UI code.
"oxp3_tool/steam_ui_js.py" = ["E501"]
