<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-FileCopyrightText: 2026 Featherwolf
  SPDX-License-Identifier: MIT

  oxp3-hw: system bus policy for the Bathysphere Hw1 provider (installed as
  /usr/share/dbus-1/system.d/io.github.featherwolf.Bathysphere.Hw1.conf).

  Only the provider's own system user may own the main name (one provider per machine) and the
  four steamos-manager remote names, which oxp3-hwd claims only while each knob works. Anyone may
  call it: every setter, remote property set and Sample is authorized by oxp3-hwd itself (the
  caller's uid must be the active seat0 session's user, never 0). Reads are open.
-->
<busconfig>
  <policy user="oxp3-hw">
    <allow own="io.github.featherwolf.Bathysphere.Hw1"/>
    <allow own="io.github.featherwolf.Bathysphere.Hw1.TdpLimit1"/>
    <allow own="io.github.featherwolf.Bathysphere.Hw1.GpuPerformanceLevel1"/>
    <allow own="io.github.featherwolf.Bathysphere.Hw1.GpuPowerProfile1"/>
    <allow own="io.github.featherwolf.Bathysphere.Hw1.BatteryChargeLimit1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.featherwolf.Bathysphere.Hw1"/>
    <allow send_destination="io.github.featherwolf.Bathysphere.Hw1.TdpLimit1"/>
    <allow send_destination="io.github.featherwolf.Bathysphere.Hw1.GpuPerformanceLevel1"/>
    <allow send_destination="io.github.featherwolf.Bathysphere.Hw1.GpuPowerProfile1"/>
    <allow send_destination="io.github.featherwolf.Bathysphere.Hw1.BatteryChargeLimit1"/>
  </policy>
</busconfig>
