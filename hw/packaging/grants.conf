#
# oxp3-hw: group grants on kernel-bounded attributes that raise no uevent udev could use
# (cpufreq policies, intel_pstate, module parameters, the xe render GT's freq0 kobject).
# Installed as /usr/lib/oxp3-hw/grants.conf, NOT in tmpfiles.d: only oxp3-hw.service applies it,
# through ExecStartPre=+, so the unit's firmware condition gates it and a provider restart applies
# it again (after an intel_pstate mode switch re-creates the policy nodes, for example).
# ci/lint_grants.py checks that every line names an allowed attribute with mode 0664 for group
# oxp3-hw. Never here: no_turbo, intel_pstate/status, scaling_min_freq, SMT, CPU online files,
# the media GT, PL4, time windows, "enabled".
z /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference 0664 root oxp3-hw -
z /sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq             0664 root oxp3-hw -
z /sys/devices/system/cpu/intel_pstate/max_perf_pct                    0664 root oxp3-hw -
z /sys/devices/system/cpu/intel_pstate/min_perf_pct                    0664 root oxp3-hw -
z /sys/module/processor_thermal_soc_slider/parameters/slider_balance   0664 root oxp3-hw -
z /sys/module/processor_thermal_soc_slider/parameters/slider_offset    0664 root oxp3-hw -
z /sys/class/drm/card*/device/tile0/gt0/freq0/min_freq                 0664 root oxp3-hw -
z /sys/class/drm/card*/device/tile0/gt0/freq0/max_freq                 0664 root oxp3-hw -
z /sys/class/drm/card*/device/tile0/gt0/freq0/power_profile            0664 root oxp3-hw -
